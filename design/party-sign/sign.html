<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pass the Aux — party sign</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@500;700&display=block" rel="stylesheet">
<style>
  @page { size: 8.5in 11in; margin: 0; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 8.5in; height: 11in; }
  body {
    background: #f3ede1;
    color: #111;
    font-family: 'Archivo', sans-serif;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
    position: relative;
    overflow: hidden;
  }
  /* Suprematist planes, echoing the site's default theme */
  .plane { position: absolute; }
  .p1 { width: 3.2in; height: 0.7in; background: #d7261e; top: 0.2in; right: -0.7in; transform: rotate(-14deg); }
  .p2 { width: 0.75in; height: 0.75in; background: #111; top: 0.75in; right: 0.35in; transform: rotate(18deg); }
  .p3 { width: 1.4in; height: 1.4in; border-radius: 50%; background: #1f4fb8; bottom: -0.35in; left: -0.4in; }
  .p4 { width: 2.4in; height: 0.2in; background: #111; bottom: 0.25in; right: -0.5in; transform: rotate(-8deg); }
  .p5 { width: 0.5in; height: 0.5in; background: #f0b90b; bottom: 0.45in; right: 0.5in; transform: rotate(30deg); }

  .sheet {
    position: relative; z-index: 1;
    height: 100%;
    padding: 0.6in 0.75in 0.6in;
    display: flex; flex-direction: column; align-items: center;
  }
  .brand {
    align-self: flex-start;
    font-family: 'Archivo Black', sans-serif;
    font-size: 22pt; letter-spacing: 0.02em; text-transform: uppercase;
  }
  h1 {
    margin-top: 0.35in;
    font-family: 'Archivo Black', sans-serif;
    font-size: 54pt; line-height: 0.95; text-align: center; letter-spacing: -0.01em;
  }
  .sub { margin-top: 0.14in; font-size: 16pt; font-weight: 500; text-align: center; }
  .qr {
    margin-top: 0.35in;
    background: #fff;
    padding: 0.28in;
    border: 5px solid #111;
    box-shadow: 0.14in 0.14in 0 #d7261e;
  }
  .qr img { display: block; width: 4in; height: 4in; }
  .or { margin-top: 0.34in; font-size: 14pt; font-weight: 700; text-transform: uppercase; letter-spacing: 0.12em; }
  .url {
    margin-top: 0.04in;
    font-family: 'Archivo Black', sans-serif;
    font-size: 50pt; line-height: 1; letter-spacing: -0.01em;
  }
  .steps {
    margin-top: 0.3in;
    display: flex; gap: 0.3in;
    font-size: 13pt; font-weight: 700;
  }
  .steps span b {
    display: inline-block; width: 0.32in; height: 0.32in; line-height: 0.32in;
    margin-right: 0.08in; text-align: center;
    background: #111; color: #f3ede1; font-family: 'Archivo Black', sans-serif; font-size: 11pt;
  }
</style>
</head>
<body>
  <div class="plane p1"></div><div class="plane p2"></div><div class="plane p3"></div>
  <div class="plane p4"></div><div class="plane p5"></div>
  <main class="sheet">
    <div class="brand">Pass the Aux</div>
    <h1>Scan to add<br>a song</h1>
    <p class="sub">Put your pick in the queue. No app, no login.</p>
    <div class="qr"><img src="qr.svg" alt="QR code for aux.tejas.nyc"></div>
    <p class="or">or type</p>
    <p class="url">aux.tejas.nyc</p>
    <div class="steps">
      <span><b>1</b>Search</span>
      <span><b>2</b>Tap add</span>
      <span><b>3</b>It plays soon</span>
    </div>
  </main>
</body>
</html>
