<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pass the Aux — party flyer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@500;700;800&display=block" rel="stylesheet">
<style>
  @page { size: 8.5in 11in; margin: 0; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 8.5in; height: 11in; }
  body {
    --ink: #121110;
    --paper: #efe8da;
    --red: #d3301f;
    --cobalt: #2a3fd0;
    --salmon: #e9927c;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Archivo', sans-serif;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
    position: relative;
    overflow: hidden;
  }

  /* Suprematist composition after the site's signature theme: one heavy black
     mass, a red diagonal thrust, a cobalt counter-stroke. Kept to the edges so
     the QR stays on clean paper. */
  .plane { position: absolute; }
  .mass { width: 1.9in; height: 1.9in; background: var(--ink); top: -0.75in; right: -0.35in; transform: rotate(14deg); }
  .thrust { width: 4.3in; height: 0.4in; background: var(--red); top: 0.52in; right: -1in; transform: rotate(-14deg); }
  .counter { width: 2.1in; height: 0.14in; background: var(--cobalt); top: 1.02in; right: 0.35in; transform: rotate(-14deg); }
  .sat { width: 0.36in; height: 0.36in; background: var(--salmon); top: 1.12in; right: 2.55in; transform: rotate(-14deg); }
  .disc { width: 1.9in; height: 1.9in; border-radius: 50%; background: var(--cobalt); bottom: -0.8in; left: -0.7in; }
  .foot-bar { width: 3.4in; height: 0.22in; background: var(--ink); bottom: 0.52in; right: -0.4in; transform: rotate(-8deg); }
  .foot-sq { width: 0.5in; height: 0.5in; background: var(--red); bottom: 0.78in; right: 0.62in; transform: rotate(-8deg); }

  .sheet {
    position: relative; z-index: 1;
    height: 100%;
    padding: 0.62in 0.7in 0.7in;
    display: flex; flex-direction: column;
  }
  .brand {
    font-family: 'Archivo Black', sans-serif;
    font-size: 17pt; letter-spacing: 0.34em; text-transform: uppercase;
  }
  h1 {
    margin-top: 0.34in;
    font-family: 'Archivo Black', sans-serif;
    font-size: 70pt; line-height: 0.88; letter-spacing: -0.02em;
    text-transform: uppercase;
  }
  h1 .hl { color: var(--red); }
  .sub {
    margin-top: 0.2in;
    font-size: 17pt; font-weight: 700; line-height: 1.25;
  }

  .scan {
    margin-top: 0.38in;
    display: flex; align-items: flex-end; gap: 0.36in;
  }
  .qr {
    flex: none;
    background: #fff;
    padding: 0.2in;
    border: 6px solid var(--ink);
    box-shadow: 0.16in 0.16in 0 var(--red);
  }
  .qr img { display: block; width: 3.5in; height: 3.5in; }

  .steps { list-style: none; display: grid; gap: 0.2in; padding-bottom: 0.1in; }
  .steps li { display: flex; align-items: center; gap: 0.14in; font-size: 17pt; font-weight: 800; line-height: 1.05; }
  .steps b {
    flex: none;
    width: 0.46in; height: 0.46in;
    display: grid; place-items: center;
    background: var(--ink); color: var(--paper);
    font-family: 'Archivo Black', sans-serif; font-size: 15pt;
  }
  .steps li:nth-child(2) b { background: var(--red); }
  .steps li:nth-child(3) b { background: var(--cobalt); }

  .url-row { margin-top: 0.36in; }
  .or { font-size: 12pt; font-weight: 800; letter-spacing: 0.24em; text-transform: uppercase; }
  .url {
    margin-top: 0.02in;
    font-family: 'Archivo Black', sans-serif;
    font-size: 56pt; line-height: 1; letter-spacing: -0.02em;
  }
  .fine { margin-top: 0.14in; font-size: 12pt; font-weight: 700; }
</style>
</head>
<body>
  <div class="plane mass"></div><div class="plane thrust"></div><div class="plane counter"></div><div class="plane sat"></div>
  <div class="plane disc"></div><div class="plane foot-bar"></div><div class="plane foot-sq"></div>
  <main class="sheet">
    <div class="brand">Pass the Aux</div>
    <h1>Scan to<br>add a <span class="hl">song</span></h1>
    <p class="sub">You pick it, it plays next-ish.<br>No app. No login. No Spotify needed.</p>
    <div class="scan">
      <div class="qr"><img src="qr.svg" alt="QR code for aux.tejas.nyc"></div>
      <ol class="steps">
        <li><b>1</b>Scan</li>
        <li><b>2</b>Search</li>
        <li><b>3</b>Tap add</li>
      </ol>
    </div>
    <div class="url-row">
      <p class="or">or type</p>
      <p class="url">aux.tejas.nyc</p>
      <p class="fine">Skipping stays with the host.</p>
    </div>
  </main>
</body>
</html>
