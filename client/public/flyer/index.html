<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pass the Aux — party flyer</title>
<meta property="og:title" content="Pass the Aux — scan to add a song">
<meta property="og:image" content="https://aux.tejas.nyc/flyer/pass-the-aux-flyer.png">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #efe8da; color: #121110;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    padding: 24px 16px 40px;
    display: flex; flex-direction: column; align-items: center; gap: 18px;
  }
  h1 { font-size: 15px; font-weight: 900; letter-spacing: 0.3em; text-transform: uppercase; }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  .actions a {
    display: inline-block; padding: 14px 20px;
    font-size: 16px; font-weight: 800; line-height: 1; text-decoration: none;
    color: #efe8da; background: #121110; border: 2px solid #121110;
  }
  .actions a.alt { background: #d3301f; border-color: #d3301f; }
  img { width: min(100%, 720px); height: auto; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.18); }
  p { font-size: 13px; max-width: 520px; text-align: center; line-height: 1.4; }
</style>
</head>
<body>
  <h1>Pass the Aux flyer</h1>
  <div class="actions">
    <a href="pass-the-aux-flyer.pdf">Print (PDF, letter)</a>
    <a class="alt" href="pass-the-aux-flyer.png" download>Save image to share</a>
  </div>
  <img src="pass-the-aux-flyer.png" alt="Pass the Aux flyer: scan to add a song, QR code for aux.tejas.nyc">
  <p>Print at 100% on letter paper. The QR code opens aux.tejas.nyc.</p>
